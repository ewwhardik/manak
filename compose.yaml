# One command starts a seeded local demo or executes the full test suite.
# "One container, one port, one volume" — completely self-contained with zero external dependencies.
services:
  manak:
    build: .
    image: manak:local
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - manak-data:/data
    environment:
      MANAK_DEMO: ${MANAK_DEMO:-true}
      MANAK_FOUNDERS: ${MANAK_FOUNDERS:-rosa@example.com}
      # Air-gap default: when MANAK_SMTP_HOST is empty, Manak uses its built-in offline maildrop,
      # outputting sign-in links to stdout with zero network sockets or third-party dependencies.
      MANAK_SMTP_HOST: ${MANAK_SMTP_HOST:-}
      MANAK_SMTP_PORT: ${MANAK_SMTP_PORT:-1025}
      MANAK_SMTP_FROM: ${MANAK_SMTP_FROM:-Manak Demo <demo@manak.local>}
      MANAK_SMTP_ENCRYPTION: ${MANAK_SMTP_ENCRYPTION:-none}
    command: ["node", "--experimental-strip-types", "tools/start-demo.ts"]
    restart: unless-stopped
    stop_grace_period: 10s
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  mailpit:
    profiles: ["mail"]
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    restart: unless-stopped
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  test:
    build: .
    image: manak:local
    environment:
      MANAK_DATABASE: ":memory:"
    command: ["npm", "test"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  test-all:
    build: .
    image: manak:local
    environment:
      MANAK_DATABASE: ":memory:"
    command: ["sh", "-c", "npm test && node --experimental-strip-types tools/prove-isolation.ts -- --check && node --experimental-strip-types tools/prove-normalization.ts -- --check"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

volumes:
  manak-data:

